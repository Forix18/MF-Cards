<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MF Cards</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    .card {
      width: 220px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      color: black;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #ffcc00;
      cursor: pointer;
    }

    button:hover {
      background: #ffb300;
    }
  </style>
</head>
<body>

<h1>MF Cards</h1>

<div class="card">
  <h2>Bronze Card</h2>
  <p>⭐ Hodnocení: 65</p>
</div>

<button onclick="alert('Vítej ve hře MF Cards!')">
  Začít
</button>

</body>
</html>
